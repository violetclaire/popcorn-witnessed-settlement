[package]
name = "popcorn-witnessed-settlement"
version = "0.1.0"
edition = "2021"
description = "NEAR testnet witnessed settlement between two agents, gated on a POPCORN witness receipt. Hackathon demo. Not for mainnet use."
license-file = "../LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
sha2 = "0.10"
borsh = "1"
schemars = "=0.8.22"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
